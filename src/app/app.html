<header class="bg-white border-bottom sticky-top">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fw-bold" routerLink="/home">RentHub</a>
      <button class="navbar-toggler" type="button" (click)="toggleMenu()">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-collapse" [class.show]="isMenuOpen">
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          @if (auth.isAuthenticated()) {
          <a class="nav-link" routerLink="/home">Home</a>
          @if(auth.isLandlord()) {
          <a class="nav-link" routerLink="/create-post">Create Post</a>
          }
          <a class="nav-link" routerLink="/communication">Messages</a>
          <a class="nav-link" routerLink="/profile">Profile</a>
          <button class="btn btn-outline-secondary btn-sm" type="button" (click)="logout()">Logout</button>
          } @else {
          <a class="nav-link" routerLink="/login">Login</a>
          <a class="btn btn-primary btn-sm" routerLink="/register">Register</a>
          }
        </div>
      </div>
    </div>
  </nav>
</header>

<main>
  <router-outlet />
</main>
