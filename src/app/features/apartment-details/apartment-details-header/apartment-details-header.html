<div class="mb-3">
    <a routerLink="/home" class="text-decoration-none">← Back to listings</a>
</div>
<div class="d-flex justify-content-between align-items-start gap-3 mb-4">
    <div>
        <h1 class="h3 fw-bold mb-1">{{ apartment().title }}</h1>
        <p class="text-muted mb-0">{{ apartment().location }}</p>
    </div>
    <button class="btn btn-outline-danger" type="button" (click)="onToggleFavourite.emit()">
        {{ isFavourite() ? '★' : '♡'}} Favourite
    </button>
</div>
