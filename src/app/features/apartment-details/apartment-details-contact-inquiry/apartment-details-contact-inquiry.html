<section class="card border-0 shadow-sm mb-4">
    <div class="card-body p-4">
        <h2 class="h5 fw-bold mb-3">Contact Information</h2>
        <div class="fw-semibold">{{ apartment().landlordName }}</div>
        <div class="text-muted mb-3">{{ apartment().landlordEmail }}</div>
        @if(isAuthenticated())
        {<button class="btn btn-primary w-100" type="button" (click)="inquiryOpen.set(true)">
            Send Inquiry</button>
        } @else {
        <a class="btn btn-primary w-100" routerLink="/login">
            Login to Send Inquiry
        </a>}
        @if(inquirySent()){
        <div class="alert alert-success mt-3 mb-0">Inquiry sent successfully.</div>}
        @if(inquiryOpen()){
        <div class="mt-3">
            <label class="form-label" for="inquiry">Message</label>
            <textarea id="inquiry" class="form-control mb-2" rows="4" [(ngModel)]="inquiryText"
                placeholder="Write your inquiry"></textarea>
            <div class="d-flex gap-2">
                <button class="btn btn-primary btn-sm" type="button" (click)="sendInquiry()">Send</button>
                <button class="btn btn-outline-secondary btn-sm" type="button"
                    (click)="inquiryOpen.set(false)">Cancel</button>
            </div>
        </div>
        }
    </div>
</section>
