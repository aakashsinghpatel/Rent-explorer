<section class="card border-0 shadow-sm mb-4">
    <div class="card-body p-4">
        <h2 class="h5 fw-bold mb-3">Rental Details</h2>
        <div class="row g-3">
            <div class="col-6 col-md-3">
                <span class="small text-muted">Rent</span>
                <div class="fw-bold">{{ apartment().price | currency:'INR':'symbol':'1.0-0' }}</div>
            </div>
            <div class="col-6 col-md-3">
                <span class="small text-muted">Area</span>
                <div class="fw-bold">{{ apartment().squareFeet }} sq ft</div>
            </div>
            <div class="col-6 col-md-3">
                <span class="small text-muted">Lease</span>
                <div class="fw-bold">{{ apartment().leaseType }}</div>
            </div>
            <div class="col-6 col-md-3">
                <span class="small text-muted">Furnished</span>
                <div class="fw-bold">{{ apartment().furnished ? 'Yes' : 'No' }}</div>
            </div>
        </div>
    </div>
</section>
