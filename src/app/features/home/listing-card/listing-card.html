<article class="card h-100 border-0 shadow-sm overflow-hidden listing-card">
    <img [src]="listing().images[0]" [alt]="listing().title" class="listing-image">
    <div class="card-body d-flex flex-column">
        <div class="small text-muted mb-1">{{ listing().location }}</div>
        <h3 class="h5 fw-bold">{{ listing().title }}</h3>
        <p class="small text-muted flex-grow-1">{{ listing().description }}</p>
        <div class="fw-bold mb-3">{{ listing().price | currency:'INR':'symbol':'1.0-0' }}/month</div>
        <div class="d-flex gap-2">
            <a class="btn btn-primary btn-sm flex-grow-1" [routerLink]="['/listing', listing().id]">View Details</a>
            <button class="btn btn-outline-secondary btn-sm" type="button" (click)="toggleFavItem.emit(listing().id)">
                <span class="favourite-icon" [class.favourite-selected]="isFavourite(listing().id)">
                    {{ isFavourite(listing().id) ? '★' : '☆' }}
                </span> Favourite
            </button>
        </div>
    </div>
</article>
