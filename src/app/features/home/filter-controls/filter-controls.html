<section class="card border-0 shadow-sm mb-4">
    <div class="card-body p-3 p-lg-4">
        <div class="row g-2 align-items-end">
            <div class="col-12 col-lg-3">
                <label class="form-label small" for="search">Search</label>
                <input id="search" class="form-control" [ngModel]="search()" (ngModelChange)="onSetSearch.emit($event)"
                    placeholder="Apartment, building...">
            </div>
            <div class="col-12 col-sm-6 col-lg-2">
                <label class="form-label small" for="location">Location</label>
                <input id="location" class="form-control" [ngModel]="location()"
                    (ngModelChange)="onSetLocation.emit($event)" placeholder="Location">
            </div>
            <div class="col-12 col-sm-6 col-lg-2">
                <label class="form-label small" for="amenity">Amenity</label>
                <select id="amenity" class="form-select" [ngModel]="amenity()"
                    (ngModelChange)="onSetAmenity.emit($event)">
                    <option value="">All</option>
                    @for(item of amenityOptions; track item) {
                    <option [value]="item">{{ item }} </option>
                    }
                </select>
            </div>
            <div class="col-6 col-sm-3 col-lg-1">
                <label class="form-label small" for="min">Min</label>
                <input id="min" class="form-control" type="number" [ngModel]="minPrice()"
                    (ngModelChange)="onSetMinPrice.emit($event)">
            </div>
            <div class="col-6 col-sm-3 col-lg-1">
                <label class="form-label small" for="max">Max</label>
                <input id="max" class="form-control" type="number" [ngModel]="maxPrice()"
                    (ngModelChange)="onSetMaxPrice.emit($event)">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <label class="form-label small" for="sort">Sort</label>
                <select id="sort" class="form-select" [ngModel]="sort()" (ngModelChange)="onSetSort.emit($event)">
                    <option value="newest">Newest</option>
                    <option value="priceAsc">Rent: Low to High</option>
                    <option value="priceDesc">Rent: High to Low</option>
                </select>
            </div>
        </div>
    </div>
</section>
