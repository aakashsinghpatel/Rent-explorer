<div class="container py-4 py-lg-5">
  <section class="mb-4">
    <div class="d-flex justify-content-between align-items-end mb-3">
      <div>
        <h1 class="page-title h3 mb-1">Featured Listings</h1>
        <p class="text-muted mb-0">Highlighted apartments available for rent.</p>
      </div>
    </div>
    <app-featured-listing [featured]="featured()" [featuredIndex]="featuredIndex()"
      (onPreviousFeatured)="previousFeatured()" (onNextFeatured)="nextFeatured()">
    </app-featured-listing>
  </section>

  <!-- All filter controls for apartments -->
  <app-filter-controls [search]="search()" [location]="location()" [amenity]="amenity()" [minPrice]="minPrice()"
    [maxPrice]="maxPrice()" [sort]="sort()" (onSetSearch)="setSearch($event)" (onSetLocation)="setLocation($event)"
    (onSetAmenity)="setAmenity($event)" (onSetMinPrice)="setMinPrice($event)" (onSetMaxPrice)="setMaxPrice($event)"
    (onSetSort)="setSort($event)">
  </app-filter-controls>

  <section>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2 class="h4 fw-bold mb-1">All Listings</h2>
        <p class="text-muted mb-0">{{ filtered().length }} matching entries</p>
      </div>
    </div>
    <div class="row g-4">
      @for (listing of paged(); track listing.id) {
      <div class="col-12 col-md-6 col-lg-4">
        <app-listing-card [listing]="listing" (toggleFavItem)="toggleFavourite($event)"></app-listing-card>
      </div>
      } @empty { <div class="col-12">
        <div class="alert alert-light border">No listings match the selected criteria.</div>
      </div> }
    </div>
    
    <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
      <button class="btn btn-outline-secondary btn-sm" type="button" [disabled]="page() === 1" (click)="previousPage()">
        Previous
      </button>
      <span class="small">Page {{ page() }} of {{ pageCount()}}</span>
      <button class="btn btn-outline-secondary btn-sm" type="button" [disabled]="page() === pageCount()"
        (click)="nextPage()">
        Next
      </button>
    </div>
  </section>
</div>
